<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Navetta Bologna</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0065b3"><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px}.container{max-width:700px;margin:auto;background:white;padding:25px;border-radius:15px;box-shadow:0 3px 12px rgba(0,0,0,.12)}h1{text-align:center;color:#0065b3}select{width:100%;padding:12px;font-size:18px;border-radius:8px}.card{background:#0065b3;color:white;padding:20px;border-radius:10px;margin-top:20px}.next{font-size:40px;font-weight:bold}li{background:#eef4fa;padding:10px;margin:5px 0;border-radius:8px;list-style:none}</style></head><body><div class="container"><h1>🚍 Navetta Bologna</h1><label style="display:block;margin-bottom:8px;font-size:16px;font-weight:bold;color:#555;">DESTINAZIONE</label><select id="destinazione" onchange="aggiorna()"><option value="lazzaretto">VIA DEL LAZZARETTO</option><option value="stazione">STAZIONE DI BOLOGNA</option></select><div class="card"><div>Prossima partenza</div><div class="next" id="prossima"></div><div id="attesa"></div></div><h3>Corse successive</h3><ul id="lista"></ul></div><script>const orari={lazzaretto:['05:45','06:35','06:55','07:05','07:15','07:25','07:35','07:45','08:05','08:40','09:15','11:55','12:20','12:40','13:20','14:00','14:30','15:00','15:30','15:50','16:00','16:15','16:30','17:00','17:30','20:30','20:48'],stazione:['06:05','06:45','07:05','07:15','07:25','07:35','07:50','08:25','08:55','09:30','12:05','12:30','13:05','13:45','14:15','14:45','15:15','15:35','15:42','16:06','16:15','16:25','16:45','17:15','17:45','20:40','21:05']};function aggiorna(){const t=document.getElementById('destinazione').value;const arr=orari[t];const n=new Date();const now=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');let p=null;for(let o of arr){if(o>=now){p=o;break;}}const ul=document.getElementById('lista');ul.innerHTML='';if(p){const[h,m]=p.split(':');const d=new Date();d.setHours(h);d.setMinutes(m);const min=Math.ceil((d-n)/60000);document.getElementById('prossima').innerText=p;document.getElementById('attesa').innerText='tra '+min+' minuti';let mostra = false;for(let o of arr){if(o === p){mostra = true;continue;}if(mostra){let li = document.createElement('li');li.textContent = o;ul.appendChild(li);}}}else{document.getElementById('prossima').innerText='Nessuna corsa';document.getElementById('attesa').innerText='Servizio terminato';}}aggiorna();setInterval(aggiorna,60000);if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));}</script></body></html>
