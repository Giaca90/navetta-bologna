    const sel = document.getElementById('destinazione');

    function formatICSDate(date) {
      const y = date.getFullYear();
      const mo = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const hh = String(date.getHours()).padStart(2, '0');
      const mm = String(date.getMinutes()).padStart(2, '0');
      const ss = String(date.getSeconds()).padStart(2, '0');
      return `${y}${mo}${d}T${hh}${mm}${ss}`;
    }

    function escapeICS(text) {
      return String(text)
        .replace(/\\/g, '\\\\')
        .replace(/;/g, '\\;')
        .replace(/,/g, '\\,')
        .replace(/\n/g, '\\n');
    }

    function mostraToast(testo) {
      const toast = document.createElement('div');

      toast.textContent = testo;

      toast.style.position = 'fixed';
      toast.style.bottom = '20px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%)';
      toast.style.background = '#333';
      toast.style.color = '#fff';
      toast.style.padding = '12px 18px';
      toast.style.borderRadius = '8px';
      toast.style.boxShadow = '0 4px 12px rgba(0,0,0,.25)';
      toast.style.zIndex = '9999';
      toast.style.fontSize = '14px';
      toast.style.maxWidth = '90%';
      toast.style.textAlign = 'center';
      toast.style.opacity = '1';

      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.transition = 'opacity 0.3s';
        toast.style.opacity = '0';
      }, 2500);

      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    function nomeGiorno(data) {
      const nomi = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
      return nomi[data.getDay()];
    }
function tipoGiorno(data) {

  const giorno = data.getDay();

  const mese = String(data.getMonth() + 1).padStart(2, '0');
  const giornoMese = String(data.getDate()).padStart(2, '0');

  const chiave = `${giornoMese}/${mese}`;

  const festivi = [
    '01/01', // Capodanno
    '06/01', // Epifania
    '25/04', // Liberazione
    '01/05', // Festa del Lavoro
    '02/06', // Repubblica
    '15/08', // Ferragosto
    '04/10',  // San Francesco
    '01/11', // Ognissanti
    '08/12', // Immacolata
    '25/12', // Natale
    '26/12', // Santo Stefano
  ];

  if (festivi.includes(chiave)) {
    return 'festivo';
  }

  if (giorno === 0) {
    return 'festivo';
  }

  if (giorno === 6) {
    return 'sabato';
  }

  return 'feriale';
}
    function etichettaGiorno(offset, data) {
      if (offset === 0) {
        return '';
      }

      if (offset === 1) {
        return 'domani';
      }

      return nomeGiorno(data);
    }

    function creaDataCorsa(oraPartenza, offsetGiorni) {
      const [h, m] = oraPartenza.split(':').map(Number);
      const data = new Date();
      data.setDate(data.getDate() + offsetGiorni);
      data.setHours(h, m, 0, 0);
      return data;
    }

    function creaPromemoria(oraPartenza, oraArrivo, offsetGiorni) {
      const dataPartenza = creaDataCorsa(oraPartenza, offsetGiorni);

      const [ha, ma] = oraArrivo.split(':').map(Number);
      const dataArrivo = new Date(dataPartenza);
      dataArrivo.setHours(ha, ma, 0, 0);

      if (dataArrivo < dataPartenza) {
        dataArrivo.setDate(dataArrivo.getDate() + 1);
      }

      const destNome =
        sel.value === 'lazzaretto'
          ? 'VIA DEL LAZZARETTO'
          : 'STAZIONE DI BOLOGNA';

      const titolo = `Navetta per ${destNome}`;
      const dettagli = `Partenza navetta alle ${oraPartenza}. Arrivo previsto alle ${oraArrivo}.`;
      const adesso = new Date();

      const ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Corsette Lazzaretto//PWA//IT',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        `UID:navetta-${sel.value}-${dataPartenza.getTime()}@corsette-lazzaretto`,
        `DTSTAMP:${formatICSDate(adesso)}`,
        `DTSTART:${formatICSDate(dataPartenza)}`,
        `DTEND:${formatICSDate(dataArrivo)}`,
        `SUMMARY:${escapeICS(titolo)}`,
        `DESCRIPTION:${escapeICS(dettagli)}`,
        `LOCATION:${escapeICS(destNome)}`,
        'BEGIN:VALARM',
        'TRIGGER:-PT10M',
        'ACTION:DISPLAY',
        'DESCRIPTION:Promemoria navetta tra 10 minuti',
        'END:VALARM',
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `promemoria-navetta-${oraPartenza.replace(':', '')}.ics`;

      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      mostraToast(`✅ Promemoria ${oraPartenza} salvato nei Download`);

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);
    }
function cambiaDestinazioneRadio(valore) {
    sel.value = valore;
    aggiorna();

function apriMappaNavetta() {

    let lat;
    let lon;

    if (sel.value === 'lazzaretto') {

        // Punto di partenza navetta per Via del Lazzaretto
        lat = 44.508283;
        lon = 11.340235;

        // al momento uso le stesse coordinate finché non mi dai quelle dell'altra fermata

        lat = 44.508283;
        lon = 11.340235;
    }

    window.open(
        `https://www.google.com/maps?q=${lat},${lon}`,
        '_blank'
    );
}

    function caricaDarkMode() {
      const darkSalvato = localStorage.getItem('dark_mode_navetta');

      if (darkSalvato === '1') {
        document.body.classList.add('dark');
        document.getElementById('btn-dark').textContent = '☀️';
      } else {
        document.getElementById('btn-dark').textContent = '🌙';
      }
    }

function generaCorseFuture() {
  const destinazione = sel.value;
  const now = new Date();
  const corseFuture = [];

  for (let offset = 0; offset <= 7; offset++) {
    const dataGiorno = new Date(now);
    dataGiorno.setDate(dataGiorno.getDate() + offset);

    const tipo = tipoGiorno(dataGiorno);
    const arr = corse[tipo][destinazione];
    const etichetta = etichettaGiorno(offset, dataGiorno);

    for (let c of arr) {
      const dataPartenza = creaDataCorsa(c.dep, offset);

      if (offset === 0 && dataPartenza < now) {
        continue;
      }

      const diffMs = dataPartenza - now;

      corseFuture.push({
        orario: c.dep,
        arrivo: c.arr,
        offsetGiorni: offset,
        etichetta: etichetta,
        dataPartenza: dataPartenza,
        diffMs: diffMs,
        tipoGiorno: tipo
      });
    }
  }

  corseFuture.sort((a, b) => a.dataPartenza - b.dataPartenza);

  return corseFuture;
}
    function aggiorna() {
      const corseFuture = generaCorseFuture();
      const prossima = corseFuture[0];
      const card = document.getElementById('card-prossima');

      if (!prossima) {
        document.getElementById('prossima').innerText = '--:--';
        document.getElementById('attesa').innerText = 'Nessuna corsa disponibile';
        document.getElementById('arrivo-prossima').innerText = '--';
        card.classList.remove('imminente');
        card.classList.remove('urgentissima');
        return;
      }

      if (prossima.etichetta) {
        document.getElementById('prossima').innerHTML =
          `${prossima.orario} <span class="badge-domani">(${prossima.etichetta})</span>`;
      } else {
        document.getElementById('prossima').innerText = prossima.orario;
      }

      document.getElementById('arrivo-prossima').innerText =
        `🏁 Arrivo previsto a destinazione: ${prossima.arrivo}`;

      document.getElementById('btn-bell-prossima').onclick = () =>
        creaPromemoria(prossima.orario, prossima.arrivo, prossima.offsetGiorni);

      const diffMs = prossima.diffMs;
      const totaleSecondi = Math.max(0, Math.floor(diffMs / 1000));
      const minutiTotali = Math.ceil(diffMs / 60000);

if (diffMs < 5 * 60 * 1000 && diffMs >= 0) {

    const minuti = Math.floor(totaleSecondi / 60);
    const secondi = totaleSecondi % 60;

    document.getElementById('attesa').innerText =
        `⛔ tra ${minuti}m ${String(secondi).padStart(2,'0')}s`;

    card.classList.remove('imminente');
    card.classList.add('urgentissima');

} else if (diffMs < 10 * 60 * 1000 && diffMs >= 0) {

    const minuti = Math.floor(totaleSecondi / 60);
    const secondi = totaleSecondi % 60;

    document.getElementById('attesa').innerText =
        `⚠️ tra ${minuti}m ${String(secondi).padStart(2,'0')}s`;

    card.classList.remove('urgentissima');
    card.classList.add('imminente');

} else {

    card.classList.remove('imminente');
    card.classList.remove('urgentissima');

    if (minutiTotali >= 60) {

        const ore = Math.floor(minutiTotali / 60);
        const minRimanenti = minutiTotali % 60;

        document.getElementById('attesa').innerText =
            `tra ${ore}h e ${minRimanenti}m`;

    } else {

        document.getElementById('attesa').innerText =
            `tra ${minutiTotali} minuti`;
    }
}
      const ul = document.getElementById('lista');
      ul.innerHTML = '';

      const corseSuccessive = mostraTutte
        ? corseFuture.slice(1, 28)
        : corseFuture.slice(1, 6);

      for (let c of corseSuccessive) {
        let li = document.createElement('li');

        let divInfo = document.createElement('div');
        divInfo.className = 'li-info';

        let spanOra = document.createElement('strong');
        spanOra.textContent = c.orario;
        divInfo.appendChild(spanOra);

        let spanArrivo = document.createElement('span');
        spanArrivo.className = 'li-arrivo';
        spanArrivo.textContent = `(Arr. ${c.arrivo})`;
        divInfo.appendChild(spanArrivo);

        if (c.etichetta) {
          let tag = document.createElement('span');
          tag.className = 'tag-domani';
          tag.textContent = c.etichetta;
          divInfo.appendChild(tag);
        }

        li.appendChild(divInfo);

        let btnBell = document.createElement('button');
        btnBell.className = 'btn-bell';
        btnBell.innerHTML = '🔔 Promemoria';
        btnBell.title = 'Promemoria 10 minuti prima della partenza';
        btnBell.onclick = () => creaPromemoria(c.orario, c.arrivo, c.offsetGiorni);

        li.appendChild(btnBell);
        ul.appendChild(li);
      }
    }

    function inizializzaDestinazioneDefault() {
      sel.value = 'lazzaretto';

      const radioLazzaretto = document.querySelector('input[name="destinazione"][value="lazzaretto"]');
      const radioFioravanti = document.querySelector('input[name="destinazione"][value="fioravanti"]');

      if (radioLazzaretto) {
        radioLazzaretto.checked = true;
      }

      if (radioFioravanti) {
        radioFioravanti.checked = false;
      }
    }

    inizializzaDestinazioneDefault();
    caricaDarkMode();
    aggiorna();

    setInterval(aggiorna, 1000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
    }
    </script>
